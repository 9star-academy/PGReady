name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      - name: Test
        run: |
          go test -race ./...
          go vet ./...
          bash scripts/install_test.sh
          installer_sha256=$(sha256sum < scripts/install.sh | cut -d ' ' -f 1)
          grep -Fxq "readonly version=$VERSION" scripts/bootstrap.sh
          grep -Fxq "readonly installer_sha256=$installer_sha256" scripts/bootstrap.sh
      - name: Build and checksum release assets
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/pgready-linux-$arch" ./cmd/pgready
          done
          test "$(dist/pgready-linux-amd64 --version)" = "pgready $VERSION"
          install -m 0755 scripts/install.sh dist/install.sh
          cd dist
          sha256sum pgready-linux-amd64 pgready-linux-arm64 > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > dist/release-notes.md <<EOF
          PGReady 是面向 Linux 服务器的 PostgreSQL 命令行管理器，提供中文数字菜单。

          - 安装和管理 PostgreSQL 实例，创建数据库与应用账号。
          - 支持单库备份、恢复到新库、日志诊断和命令速查。
          - 支持 Ubuntu 22.04、24.04、26.04 LTS 和 Debian 12、13 上的 APT 本机实例。
          - 安装入口、校验文件和程序包支持直连优先、镜像优先和仅直连三种下载模式。

          服务器安装命令见 [README](https://github.com/9star-academy/PGReady/blob/$VERSION/README.md)。
          EOF
          gh release create "$VERSION" --verify-tag --title "PGReady $VERSION" \
            --notes-file dist/release-notes.md \
            dist/pgready-linux-amd64 dist/pgready-linux-arm64 dist/SHA256SUMS dist/install.sh
      - name: Verify public installer on Linux amd64
        run: |
          PGREADY_DOWNLOAD_MODE=direct bash scripts/bootstrap.sh
          test "$(pgready --version)" = "pgready $VERSION"
          printf '8\n0\n0\n' | pgready | grep -F '1. 快速上手'
